<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue #9 Matching Debug</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      background: #222;
    }
  </style>
</head>
<body>
  <iframe id="app" src="/" title="Unmapped Spotify Listens matching debug"></iframe>
  <script>
    const frame = document.getElementById('app');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById('issue-9-debug-loader')) return;

      const matcher = doc.createElement('script');
      matcher.id = 'issue-9-debug-loader';
      matcher.src = '/matching-debug.js';
      matcher.addEventListener('load', () => {
        const filter = doc.createElement('script');
        filter.id = 'issue-9-filter-loader';
        filter.src = '/filter-debug.js';
        doc.body.appendChild(filter);
      });
      doc.body.appendChild(matcher);
    });
  </script>
</body>
</html>
